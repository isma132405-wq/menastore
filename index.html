<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENASTORE | Tienda Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Barra de navegación -->
  <nav class="bg-slate-900 text-white px-6 py-4 shadow-md flex justify-between items-center sticky top-0 z-40">
    <h1 class="text-2xl font-black tracking-wider text-emerald-400">MENA<span class="text-white">STORE</span></h1>
    <div class="flex items-center gap-3">
      <button id="btn-abrir-carrito" onclick="abrirCarrito()" class="relative text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-2">
        <span>Carrito</span>
        <span id="badge-carrito" class="bg-slate-900 text-emerald-400 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
      </button>

      <span id="badge-admin" class="hidden text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-full font-semibold">Modo Admin</span>
      <button id="btn-abrir-login" onclick="abrirModalLogin()" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg border border-slate-700 transition">
        Acceso Admin
      </button>
      <button id="btn-cerrar-sesion" onclick="cerrarSesion()" class="hidden text-sm bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-lg font-medium transition">
        Cerrar Sesión
      </button>
    </div>
  </nav>

  <!-- Banner de aviso -->
  <div class="bg-amber-100 border-b border-amber-200 text-amber-900 px-4 py-2 text-center text-xs sm:text-sm font-semibold tracking-wide">
    PAGINA EN CONSTRUCCIÓN :) &bull; CREADO POR IMENA
  </div>

  <!-- Contenedor principal -->
  <main class="max-w-6xl mx-auto p-6 w-full flex-grow">
    <div id="layout-principal" class="grid grid-cols-1 gap-8">
      
      <!-- Panel de administración -->
      <section id="panel-admin" class="hidden lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 id="titulo-form-admin" class="text-lg font-bold text-slate-900">Registrar Nuevo Producto</h2>
          <button type="button" id="btn-cancelar-edicion" onclick="cancelarEdicion()" class="hidden text-xs text-slate-500 hover:text-red-600 underline">Cancelar</button>
        </div>
        <form id="form-producto" class="space-y-4">
          <input type="hidden" id="edit-id">
          <div>
            <label class="block text-sm font-medium mb-1">Nombre del artículo</label>
            <input type="text" id="nombre" required placeholder="Ej. Camiseta FC Barcelona" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium mb-1">Precio (₡)</label>
              <input type="number" id="precio" required placeholder="25000" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Stock</label>
              <input type="number" id="stock" required placeholder="10" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Categoría</label>
            <select id="categoria" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="Camisetas">Camisetas</option>
              <option value="Calzado">Calzado</option>
              <option value="Balones">Balones</option>
              <option value="Accesorios">Accesorios</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">URL de la imagen</label>
            <input type="url" id="imagen" placeholder="https://..." class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <button type="submit" id="btn-guardar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
            Guardar en Base de Datos
          </button>
        </form>
      </section>

      <!-- Catálogo público -->
      <section id="seccion-catalogo" class="col-span-1">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
          <h2 class="text-xl font-bold text-slate-900">Catálogo Disponible</h2>
          <span id="contador" class="text-sm text-slate-500 bg-slate-200 px-3 py-1 rounded-full font-medium w-fit">Cargando...</span>
        </div>

        <!-- Buscador y Filtros por Categoría -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 space-y-3">
          <input type="text" id="buscador" oninput="aplicarFiltros()" placeholder="Buscar camiseta, equipo o artículo..." class="w-full border border-slate-200 rounded-lg px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <div id="filtros-categoria" class="flex flex-wrap gap-2">
            <button onclick="seleccionarCategoria('Todas')" data-cat="Todas" class="btn-cat bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">Todas</button>
            <button onclick="seleccionarCategoria('Camisetas')" data-cat="Camisetas" class="btn-cat bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">Camisetas</button>
            <button onclick="seleccionarCategoria('Calzado')" data-cat="Calzado" class="btn-cat bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">Calzado</button>
            <button onclick="seleccionarCategoria('Balones')" data-cat="Balones" class="btn-cat bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">Balones</button>
            <button onclick="seleccionarCategoria('Accesorios')" data-cat="Accesorios" class="btn-cat bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">Accesorios</button>
          </div>
        </div>

        <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Las tarjetas se inyectan aquí desde app.js -->
        </div>
      </section>

    </div>
  </main>

  <!-- Pie de página -->
  <footer class="bg-slate-900 text-slate-400 text-center py-4 text-xs tracking-wider border-t border-slate-800 mt-10">
    PAGINA EN CONSTRUCCIÓN :) &mdash; CREADO POR <span class="text-emerald-400 font-bold">IMENA</span>
  </footer>

  <!-- Drawer lateral del Carrito de Compras -->
  <div id="drawer-carrito" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between">
      <div class="p-5 border-b flex justify-between items-center bg-slate-900 text-white">
        <h3 class="text-lg font-bold">Tu Carrito de Compras</h3>
        <button onclick="cerrarCarrito()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div id="lista-carrito" class="p-5 flex-grow overflow-y-auto space-y-4">
        <!-- Items del carrito -->
      </div>

      <div class="p-5 border-t bg-slate-50 space-y-3">
        <div class="flex justify-between items-center text-lg font-black text-slate-900">
          <span>Total estimado:</span>
          <span id="total-carrito">₡0</span>
        </div>
        <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-sm">
          Confirmar Pedido por WhatsApp
        </button>
        <button onclick="vaciarCarrito()" class="w-full text-xs text-slate-500 hover:text-red-600 py-1 transition">
          Vaciar carrito
        </button>
      </div>
    </div>
  </div>

  <!-- Modal flotante de inicio de sesión -->
  <div id="modal-login" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-900">Panel Administrativo</h3>
        <button onclick="cerrarModalLogin()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
      </div>
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Correo electrónico</label>
          <input type="email" id="login-email" required placeholder="admin@menastore.com" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <button type="submit" id="btn-submit-login" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
