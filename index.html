<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENASTORE | Tienda Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Barra de navegación -->
  <nav class="bg-slate-900 text-white px-6 py-4 shadow-md flex justify-between items-center">
    <h1 class="text-2xl font-black tracking-wider text-emerald-400">MENA<span class="text-white">STORE</span></h1>
    <div class="flex items-center gap-4">
      <span id="badge-admin" class="hidden text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-full font-semibold">Modo Administrador</span>
      <button id="btn-abrir-login" onclick="abrirModalLogin()" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg border border-slate-700 transition">
        Acceso Admin
      </button>
      <button id="btn-cerrar-sesion" onclick="cerrarSesion()" class="hidden text-sm bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-lg font-medium transition">
        Cerrar Sesión
      </button>
    </div>
  </nav>

  <!-- Banner de aviso -->
  <div class="bg-amber-100 border-b border-amber-200 text-amber-900 px-4 py-2 text-center text-xs sm:text-sm font-semibold tracking-wide">
    PAGINA EN CONSTRUCCIÓN :) &bull; CREADO POR IMENA
  </div>

  <!-- Contenedor principal -->
  <main class="max-w-6xl mx-auto p-6 w-full flex-grow">
    <div id="layout-principal" class="grid grid-cols-1 gap-8">
      
      <!-- Panel de administración (Oculto por defecto para clientes) -->
      <section id="panel-admin" class="hidden lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-bold mb-4 border-b pb-2 text-slate-900">Registrar Nuevo Producto</h2>
        <form id="form-producto" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Nombre del artículo</label>
            <input type="text" id="nombre" required placeholder="Ej. Camiseta FC Barcelona" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium mb-1">Precio (₡)</label>
              <input type="number" id="precio" required placeholder="25000" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Stock</label>
              <input type="number" id="stock" required placeholder="10" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Categoría</label>
            <select id="categoria" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="Camisetas">Camisetas</option>
              <option value="Calzado">Calzado</option>
              <option value="Balones">Balones</option>
              <option value="Accesorios">Accesorios</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">URL de la imagen</label>
            <input type="url" id="imagen" placeholder="https://..." class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <button type="submit" id="btn-guardar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">
            Guardar en Base de Datos
          </button>
        </form>
      </section>

      <!-- Catálogo público -->
      <section id="seccion-catalogo" class="col-span-1">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-slate-900">Catálogo Disponible</h2>
          <span id="contador" class="text-sm text-slate-500 bg-slate-200 px-3 py-1 rounded-full font-medium">Cargando...</span>
        </div>
        <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Las tarjetas se inyectan aquí desde app.js -->
        </div>
      </section>

    </div>
  </main>

  <!-- Pie de página -->
  <footer class="bg-slate-900 text-slate-400 text-center py-4 text-xs tracking-wider border-t border-slate-800 mt-10">
    PAGINA EN CONSTRUCCIÓN :) &mdash; CREADO POR <span class="text-emerald-400 font-bold">IMENA</span>
  </footer>

  <!-- Modal flotante de inicio de sesión -->
  <div id="modal-login" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-900">Panel Administrativo</h3>
        <button onclick="cerrarModalLogin()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
      </div>
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Correo electrónico</label>
          <input type="email" id="login-email" required placeholder="admin@menastore.com" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <button type="submit" id="btn-submit-login" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
